[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions directory
[functions]
  directory         = "netlify/functions"
  node_bundler      = "esbuild"

[secrets_scanning]
  enabled = true
  omit_keys = ["VITE_SUPABASE_ANON_KEY", "VITE_SUPABASE_URL"]

# API routes — served by Netlify Functions
[[redirects]]
  from   = "/api/send-welcome-email"
  to     = "/.netlify/functions/send-welcome-email"
  status = 200

[[redirects]]
  from   = "/api/send-reset-email"
  to     = "/.netlify/functions/send-reset-email"
  status = 200

# SPA fallback — serve index.html for every route
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived caching for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
